# ==================== USUARIOS DB ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: usuarios-init
  namespace: microservicios
data:
  init.sql: |
    CREATE TABLE usuarios (
        id SERIAL PRIMARY KEY,
        nombre VARCHAR(100) NOT NULL,
        email VARCHAR(150) UNIQUE NOT NULL
    );
    INSERT INTO usuarios (nombre, email) VALUES
    ('Ana Torres', 'ana@correo.com'),
    ('Luis Pérez', 'luis@correo.com'),
    ('Carlos Mendoza', 'carlos@correo.com');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: usuarios-data
  namespace: microservicios
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-db
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-db
  template:
    metadata:
      labels:
        app: usuarios-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: usuarios_db
            - name: POSTGRES_USER
              value: usuarios_user
            - name: POSTGRES_PASSWORD
              value: usuarios123
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: usuarios-data
        - name: init-sql
          configMap:
            name: usuarios-init
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-db
  namespace: microservicios
spec:
  selector:
    app: usuarios-db
  ports:
    - port: 5432
      targetPort: 5432

